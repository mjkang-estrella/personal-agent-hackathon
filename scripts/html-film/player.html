<!doctype html><html lang="en"><head><meta charset="utf-8"><title>JobSwitch — three-minute demo</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#eae7df;font-family:Arial,sans-serif;color:#26332d;overflow:hidden}#film{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center;background:#f8f6f1;overflow:hidden}.mast{position:absolute;top:30px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;color:#075bd8;font-weight:700;letter-spacing:-1px}.tag{font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#6c726c}.title{position:absolute;top:69px;left:70px;font-size:31px;font-family:Georgia,serif;margin:0;font-weight:400}#frame{position:absolute;top:126px;left:80px;width:1760px;height:902px;border:1px solid #deded4;border-radius:14px;overflow:hidden;box-shadow:0 16px 50px #233c3010;background:#fff}#shot{width:100%;height:100%;object-fit:cover;transform-origin:50% 40%}#caption{position:absolute;bottom:35px;left:290px;right:290px;text-align:center;z-index:4;pointer-events:none}#caption span{background:rgba(20,31,29,.94);color:white;font-size:23px;line-height:1.45;padding:10px 19px;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}#progress{position:absolute;bottom:0;height:4px;background:#075bd8;left:0}#end{position:absolute;inset:0;display:none;background:#f8f6f1;align-items:center;justify-content:center;flex-direction:column}#end h1{font-size:116px;font-family:Georgia,serif;font-weight:400;letter-spacing:-5px;margin:20px;color:#075bd8}#end p{font:42px Georgia,serif}#end small{font-size:17px;color:#777e75;margin-top:80px}#controls{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:12px;background:#fff;padding:10px 18px;border-radius:30px;box-shadow:0 5px 30px #0002}button{background:#075bd8;color:#fff;border:0;border-radius:20px;padding:9px 20px;font:14px Arial;cursor:pointer}input{width:280px}#clock{font:14px Arial;align-self:center}
</style></head><body><main id="film"><div class="mast"><div class="brand">↔ JobSwitch</div><div class="tag">Fictional demo · simulated actions · AI narration</div></div><h2 class="title" id="title"></h2><div id="frame"><img id="shot" alt="JobSwitch product interface"></div><div id="caption"><span></span></div><section id="end"><h1>JobSwitch.</h1><p>Your next chapter, with fewer loose ends.</p><small>Fictional employers · Test HR workflow · AI-generated narration</small></section><div id="progress"></div></main><div id="controls"><button id="play">Play demo</button><input id="seek" aria-label="Video position" type="range" min="0" max="180" step="0.1" value="0"><span id="clock">0:00 / 3:00</span></div><audio id="audio" src="narration.wav" preload="auto"></audio><script>
const assets=__ASSETS__;let scenes=[];const audio=document.querySelector('#audio');const film=document.querySelector('#film');const shot=document.querySelector('#shot');let current='';
function fit(){film.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}addEventListener('resize',fit);fit();
window.renderFilm=function(t){t=Math.max(0,Math.min(179.999,t));const i=scenes.findIndex(s=>t>=s.start&&t<s.start+s.duration);const s=scenes[i];if(!s)return;const local=t-s.start;document.querySelector('#title').textContent=String(i+1).padStart(2,'0')+' / '+s.title;document.querySelector('#end').style.display=i===9?'flex':'none';const active=s.shots.filter(v=>v[0]<=local).at(-1);if(active){const file=assets[active[1]];if(file!==current){shot.src=file;current=file}const phase=Math.min(1,(local-active[0])/8);shot.style.transform=`scale(${1+phase*.009})`;}document.querySelector('#progress').style.width=t/180*100+'%';
const chunks=s.text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[s.text];const elapsed=local-s.lead;let subtitle='';let at=0;const total=chunks.reduce((n,c)=>n+c.length,0);for(const c of chunks){const len=c.length/total*s.speech;if(elapsed>=at&&elapsed<at+len)subtitle=c.trim();at+=len;}document.querySelector('#caption span').textContent=subtitle;document.querySelector('#caption').style.display=subtitle&&i!==9?'block':'none';document.querySelector('#seek').value=t;document.querySelector('#clock').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 3:00';};
Promise.resolve(__SCENES__).then(async data=>{scenes=data;await Promise.all([...new Set(scenes.flatMap(s=>s.shots.map(x=>x[1])))].map(id=>new Promise(resolve=>{const im=new Image();im.onload=resolve;im.onerror=resolve;im.src=assets[id]})));window.renderFilm(0);window.filmReady=true;});
function loop(){if(!audio.paused)window.renderFilm(audio.currentTime);requestAnimationFrame(loop)}loop();document.querySelector('#play').onclick=async()=>{if(audio.paused){if(audio.ended)audio.currentTime=0;await audio.play();document.querySelector('#play').textContent='Pause'}else{audio.pause();document.querySelector('#play').textContent='Play demo'}};document.querySelector('#seek').oninput=e=>{audio.currentTime=+e.target.value;window.renderFilm(audio.currentTime)};audio.onended=()=>document.querySelector('#play').textContent='Replay';if(new URLSearchParams(location.search).has('capture'))document.querySelector('#controls').style.display='none';
</script></body></html>
